name: vectors
on:
  push:
  pull_request:
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # uibc-core 0.5.0 prints Chinese "basis.note" strings; on Windows runners the
      # default cp1252 console raises UnicodeEncodeError. This is a workaround for an
      # upstream defect, recorded in EXPECTED.md, not a fix.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install --disable-pip-version-check "uibc-core==0.5.0"
      - name: matrix gate (eight rows)
        run: python tools/run_vectors.py
      - name: adversarial supplement (9 must-reject + 3 documented gaps)
        run: python tools/run_adversarial.py

  hygiene:
    # Two questions that the matrix gate cannot answer, because both can be
    # false while all six rows still match. One runner is enough: neither
    # question is platform-dependent, and neither needs uibc-core installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: key hygiene (no seed outside keys/, fixtures pinned by digest)
        run: python tools/check_key_hygiene.py
      - name: frozen fixtures (committed bytes vs FIXTURES.sha256)
        run: python tools/check_frozen.py
      - name: report checker negative control (doctored reports must be rejected)
        run: python tools/check_report.py --selftest
      - name: receipt ledger (every committed receipt must still describe the committed bytes)
        run: |
          set -e
          for f in receipts/*.json; do
            echo "--- $f"
            python tools/check_receipt.py "$f"
          done

  crossimpl:
    # The question the matrix gate cannot answer: would a verifier written in
    # another language, sharing no code, reach the same verdict? "Another
    # language" is not "another maintainer" - both are labelled in
    # implementations.json, and the label is checked, not trusted.
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check "uibc-core==0.5.0"
      - name: cross-implementation replay (8 matrix + 12 adversarial rows)
        run: python tools/run_crossimpl.py
      - name: implementations manifest (counts and independence labels must match the run)
        run: python tools/check_implementations.py

  gate-summary:
    # One required check with a stable name, instead of five check names that
    # change whenever the matrix changes. A branch rule that pins
    # "gate (windows-latest, 3.11)" silently stops protecting anything the
    # moment that leg is renamed or dropped, and nothing announces it. This job
    # is the only context the default-branch ruleset requires.
    needs: [gate, hygiene, crossimpl]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail if any required leg did not succeed
        env:
          GATE: ${{ needs.gate.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          CROSSIMPL: ${{ needs.crossimpl.result }}
        run: |
          echo "gate:       $GATE"
          echo "hygiene:    $HYGIENE"
          echo "crossimpl:  $CROSSIMPL"
          if [ "$GATE" != "success" ] || [ "$HYGIENE" != "success" ] || [ "$CROSSIMPL" != "success" ]; then
            echo "::error::a required leg did not succeed"
            exit 1
          fi
          echo "all required legs green"
