name: vectors
on:
  push:
  pull_request:
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # uibc-core 0.5.0 prints Chinese "basis.note" strings; on Windows runners the
      # default cp1252 console raises UnicodeEncodeError. This is a workaround for an
      # upstream defect, recorded in EXPECTED.md, not a fix.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python -m pip install --disable-pip-version-check "uibc-core==0.5.0"
      - name: matrix gate (eight rows)
        run: python tools/run_vectors.py
      - name: adversarial supplement (9 must-reject + 3 documented gaps)
        run: python tools/run_adversarial.py

  hygiene:
    # Two questions that the matrix gate cannot answer, because both can be
    # false while all eight rows still match. One runner is enough, and nothing
    # here needs uibc-core: this job is about the repository's own bytes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: key hygiene (no seed outside keys/, fixtures pinned by digest)
        run: python tools/check_key_hygiene.py
      - name: frozen fixtures (committed bytes vs FIXTURES.sha256)
        run: python tools/check_frozen.py
      - name: report checker negative control (doctored reports must be rejected)
        run: python tools/check_report.py --selftest
      - name: receipt ledger (every committed receipt must still describe the committed bytes)
        run: |
          set -e
          for f in receipts/*.json; do
            echo "--- $f"
            python tools/check_receipt.py "$f"
          done

  submission:
    # The submission validator is no longer dependency-free: since a named
    # witness must now ship a signed statement (S11/S12), the self-test signs
    # one with a freshly generated key and one with the published owner seed.
    # It therefore needs uibc-core's Ed25519 primitives, and it lives in its own
    # job for the same reason crossversion does - so that hygiene stays a test
    # of the repository's bytes and nothing else.
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uibc-core==0.5.0"
      - name: submissions (a stranger's run is judged by the corpus, not by the PR author)
        run: python tools/check_submission.py
      - name: submission validator self-test (doctored submissions must be refused, one honest one accepted)
        run: python tools/check_submission.py --selftest

  crossversion:
    # The eight rows above are the answer of a verifier AT the declared floor
    # (min_verifier_version 0.5.0). This job asks the question the matrix cannot:
    # what does a verifier BELOW the floor answer, and does it refuse to call a
    # package healthy? Only one thing is forbidden there - PASS. Both INCONCLUSIVE
    # ("cannot judge") and FAIL ("a defect was visible anyway") are honest answers,
    # so a red cell here would mean the floor stopped working, not that an old
    # release is old.
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uibc-core==0.5.0"
      - name: a second interpreter carrying the previous release
        run: |
          set -e
          python -m venv .venv041
          .venv041/bin/python -m pip install --disable-pip-version-check "uibc-core==0.4.1"
          .venv041/bin/python -c "import uibc_core; print('0.4.1 side:', uibc_core.__version__)"
      - name: cross-version matrix (above floor must match, below floor must never PASS)
        run: python tools/run_crossversion.py --also .venv041/bin/python
      - name: the committed matrix is not stale
        run: |
          set -e
          python tools/run_crossversion.py --also .venv041/bin/python > /dev/null
          git diff --exit-code crossversion-results.json VERSION-MATRIX.md \
            || { echo "::error::VERSION-MATRIX.md or crossversion-results.json is stale - regenerate and commit"; exit 1; }

  gate-summary:
    # One required check with a stable name, instead of five check names that
    # change whenever the matrix changes. A branch rule that pins
    # "gate (windows-latest, 3.11)" silently stops protecting anything the
    # moment that leg is renamed or dropped, and nothing announces it. This job
    # is the only context the default-branch ruleset requires.
    needs: [gate, hygiene, crossversion, submission]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail if any required leg did not succeed
        env:
          GATE: ${{ needs.gate.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          XVER: ${{ needs.crossversion.result }}
          SUB: ${{ needs.submission.result }}
        run: |
          echo "gate:    $GATE"
          echo "hygiene: $HYGIENE"
          echo "crossversion: $XVER"
          echo "submission: $SUB"
          if [ "$GATE" != "success" ] || [ "$HYGIENE" != "success" ] || [ "$XVER" != "success" ] || [ "$SUB" != "success" ]; then
            echo "::error::a required leg did not succeed"
            exit 1
          fi
          echo "all required legs green"


