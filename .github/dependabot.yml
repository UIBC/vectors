version: 2
updates:
  # The repository has no Python dependency manifest: uibc-core is installed at
  # a pinned version inside CI, deliberately, because a floating verifier would
  # make the six rows answer a different question tomorrow. What can drift is
  # the actions themselves, so that is what is tracked here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
      include: "scope"
